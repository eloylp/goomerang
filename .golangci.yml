run:
  build-tags:
    - unit
    - integration
    - racy
    - long
linters-settings:
  dupl:
    threshold: 100
  forbidigo:
    # Forbid the following identifiers
    forbid:
      #- fmt.Errorf # consider errors.Errorf in github.com/pkg/errors
      - fmt.Print.* # too much log noise
      - log.Print.*
  gocognit:
    min-complexity: 8
  funlen:
    lines: 120
    statements: 50
  nestif:
    min-complexity: 8
  goconst:
    min-len: 2
    min-occurrences: 2
  gocritic:
    enabled-tags:
      - diagnostic
      - experimental
      - opinionated
      - performance
      - style
    disabled-checks:
      - dupImport # https://github.com/go-critic/go-critic/issues/845
      - ifElseChain
      - octalLiteral
      - whyNoLint
      - wrapperFunc
      - hugeParam
  gocyclo:
    min-complexity: 15
  goimports:
    local-prefixes: go.eloylp.dev/goomerang
  gosec:
    excludes:
      - G115
  mnd:
    checks:
      - argument
      - case
      - condition
      - return
  lll:
    line-length: 140
  misspell:
    locale: US
linters:
  # please, do not use `enable-all`: it's deprecated and will be removed soon.
  # inverted configuration with `enable-all` and `disable` is not scalable during updates of golangci-lint
  disable-all: true
  enable:
    - bodyclose
    - dogsled
    - errcheck
    - forbidigo
    - funlen
    - gochecknoinits
    - gocyclo
    - gofmt
    - goimports
    - goprintffuncname
    - gosec
    - gosimple
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - rowserrcheck
    - staticcheck
    - stylecheck
    - typecheck
    - unconvert
    - unparam
    - unused
    - whitespace
    - nestif
  # don't enable:
  # - gochecknoglobals
  # - gocognit
  # - godox
  # - maligned
  # - prealloc

issues:
  # Excluding configuration per-path, per-linter, per-text and per-source
  exclude-rules:
    - path: _test\.go
      linters:
        - mnd
        - gochecknoinits
        - gosec
        - bodyclose
        - errcheck
        - dupl
        - forbidigo
        - lll
    - path: cmd
      linters:
        - mnd
        - gochecknoinits
        - gosec
        - bodyclose
        - errcheck
        - dupl
        - forbidigo
        - gocritic
        - goimports
        - goconst
